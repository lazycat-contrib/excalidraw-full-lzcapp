name: Excalidraw
package: community.lazycat.app.excalidraw-full
version: 0.1.0
min_os_version: 1.3.8
description: 您的自托管、云就绪协作平台.
homepage: https://github.com/BetterAndBetterII/excalidraw-full
author: BetterAndBetterII
application:
    subdomain: excalidraw-full
    background_task: true
    public_path:
        - /

    upstreams:
        - location: /
          backend: http://excalidraw-full:3002/
services:
    excalidraw-full:
        container_name: excalidraw-full
        # ghcr.io/betterandbetterii/excalidraw-full:latest
        image: xget.xi-xu.me/cr/ghcr/betterandbetterii/excalidraw-full:latest

        environment:
            - STORAGE_TYPE=sqlite
            - DATA_SOURCE_NAME=/root/db/excalidraw.db
            - LOCAL_STORAGE_PATH=/root/data

            - JWT_SECRET={{stable_secret "excalidraw#secret_key"}}
            - GITHUB_CLIENT_ID={{.U.github_client_id}}
            - GITHUB_CLIENT_SECRET={{.U.github_client_secret}}
            - GITHUB_REDIRECT_URL={{.U.github_redirect_url}}

            - OPENAI_BASE_URL={{.U.openai_base_url}}
            - OPENAI_API_KEY={{.U.openai_api_key}}

        binds:
            - /lzcapp/var/data:/root/data
            - /lzcapp/var/db:/root/db
