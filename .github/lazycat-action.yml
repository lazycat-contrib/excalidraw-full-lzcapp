version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/excalidraw-full.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: excalidraw-full
    bump: patch
build:
  run_buildscript: false
images:
  - id: excalidraw-full
    target: service
    service: excalidraw-full
    source: ghcr.io/betterandbetterii/excalidraw-full
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      require_digest_match: true
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Excalidraw
    summary: "您的自托管、云就绪协作平台"
